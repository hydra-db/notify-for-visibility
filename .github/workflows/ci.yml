name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: check-dist
        run: |
          npm run build
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is stale. Run npm run build and commit the result."
            exit 1
          fi
